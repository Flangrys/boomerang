name: Deploy Boomerang Javadocs

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Deploy Boomerang Javadocs
        uses: MathieuSoysal/Javadoc-publisher.yml@v3.0.2
        with:
          GITHUB_TOKEN: ${{ github.token }}
          javadoc-branch: docs/javadocs
          target-folder: javadoc-page
          java-version: 21
          project: gradle